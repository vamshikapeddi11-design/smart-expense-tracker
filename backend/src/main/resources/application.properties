server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/expensetracker
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=MyVeryStrongSecretKeyForExpenseTracker2026
jwt.expiration-ms=86400000

# --- ML service --------------------------------------------------------
# The Python ML microservice (categorization). Backend calls it when a new
# expense has no category. The frontend never calls ML directly.
ml.service.url=http://localhost:8000

# --- Bank sync ---------------------------------------------------------
# Automatic background bank sync (every 6h). OFF by default so student demos
# don't hit the (mock) bank provider unexpectedly. Enable with
# bank.sync.enabled=true. Manual sync via POST /api/bank/sync always works.
bank.sync.enabled=false

# --- File upload limits (statement import, QR scan) --------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Logging -----------------------------------------------------------
logging.level.com.expensetracker=INFO
